          > **⚠️ Manual install / archive users**: The dependencies above are declared in the distribution packages (RPM/DEB/FreeBSD), but **`.zip` and `.tar.gz` archives do not bundle them**. Package names and package managers differ by platform/distribution (for example, `libmaxmind-db-reader-perl` is installed via `apt` on Debian/Ubuntu, is `perl-MaxMind-DB-Reader` on RHEL-family systems, and is `perl-maxmind-db-reader` on Arch), so please search for and install the corresponding packages for your system. Thank you for supporting the Community Edition.

          ## 🚀 Quick Start

          ### Using HestiaCP (Recommended)
          If you use [Hestia Control Panel](https://hestiacp.com/), AWStats will be configured automatically:
          1. AWStats is automatically enabled when adding a domain
          2. Log path is automatically configured
          3. Scheduled updates are automatically added
          4. Visit `https://your-domain/vstats/` to view statistics

          ## 🔄 Pre-Upgrade Conversion (Only for Upgrading from Older Versions)

          When upgrading from older versions (7.0–7.9), run `awstats_convert-zh.pl` first to convert historical data files (`*.txt`) to the 8.x format, then run the update; otherwise the update will fail due to format incompatibility. The script auto-detects files under `/home/*/web/*/stats/` and converts them in batches, backing up originals first.

          > **Note**: If your site version is below 7.0, adjust the script's regex `s/AWSTATS DATA FILE 7\.[0-9]{1,2}/AWSTATS DATA FILE 8.1/` according to your actual version.
          >
          > **💡 Tip**: Backups are saved by default in `/backup/awstats_converter/backup_<timestamp>/`.

