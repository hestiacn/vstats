          ## ✨ 主要更新

          ### 🎯 8.2 版本（2026-11-11）

          可选 SVG 图表、已验证爬虫证据、Filters 静态发布器；以及历史压缩原子性、一批 undef/解析修复。

          ### 📊 可选 SVG 图表插件（`graphsvg`）

          > 贡献者：@Bllacky

          **背景**：原 `graphgooglechartapi` 依赖的 Google Image Charts API 已于 2019 年 3 月关闭，旧报告图表破图（含静态发布报告）。`graphsvg` 在本地生成内联 SVG 修复，且不向第三方发送访客统计。

          - **默认不启用**；不启用时仍使用 AWStats 原生图表
          - 启用方式：配置中添加 `LoadPlugin="graphsvg"`
          - **不要同时启用其他 ShowGraph 插件**（如 `graphgooglechartapi`），不支持该组合
          - `graphsvg` 与 `geoipfree` 挂不同钩子，**可同时启用、不冲突**——不要为了启用 `graphsvg` 而移除 `geoipfree`
          - 无外部图表服务 / JS 依赖，离线与静态报告均可用

          ### 🕷️ 已验证爬虫证据（Verified Crawler Evidence）

          > 贡献者：@Bllacky

          **背景**：原生 AWStats 仅凭 User-Agent 判断爬虫，UA 可任意伪造（如 `curl -A "Googlebot/2.1"`），真爬虫与伪装扫描器无法区分。本功能在 UA 之外增加"官方 IP 段 + 时间戳"双重验证。

          - 新增 `VerifiedCrawlerEvidenceFile` 配置项 + `VStats::TrafficClassifier` 校验 + 主流程 `classify_line`
          - **仅支持 `LogType=W` 且 `LogFormat=1(combined)/4(common)`**
          - 证据缺失/非法/超限/close 失败 → **中止本次 update**（不降级、不退回原生规则）
          - 证据文件须为非符号链接常规文件、大小不超过 `evidence_bundle_bytes`
          - 命中后记 `Googlebot/`、304 响应体归零、在下载追踪前运行
          - 当前仅注册 `google_common` 提供商
          - **本层为追加验证，不替换原生 UA/机器人/错误规则**

          ### 🧩 Filters 静态发布器

          新增 `Filters` 静态发布器，6 类 family：

          `signatures` / `provider_evidence` / `probing_and_scanning` / `automated_browsing` / `scanner_inference` / `metadata`

          配套工具：`tools/traffic-classify.pl`（离线请求报告）、`tools/automation_analysis.py`（语料分析）、`tools/vstats_filters.py`（行为过滤）。

          详见 [`docs/filters.md`](https://github.com/${{ github.repository }}/blob/release/docs/filters.md) 与 [`docs/traffic-classification.md`](https://github.com/${{ github.repository }}/blob/release/docs/traffic-classification.md) 文档。

          ### 🛠️ 其他变更

          - 新增 `VSTATS_NATIVE_INCLUDE_ROOT`（CLI 模式，重定向相对 include 路径）
          - 历史 `.txt` 压缩改为纯 Perl `IO::Compress::Gzip` + 原子 rename；压缩前后比对 `dev/ino/mode/uid/gid/size/mtime/ctime` 八字段，变更即中止、失败保留原文件
          - `Compress_Previous_Month_History` 改为 2 号起压缩更早月份，保留当前月与上月
          - `gzip` 历史与明文统一 `UTF-8` 解码
          - `CLI` 错误诊断走 `stderr`，`HTML/CGI` 走 `stdout`；HTML 错误响应中转义日志样本/文件名
          - `ShowGraph_$pluginname` 改用 `__PACKAGE__->can`
          - 206 分块不再重复计带宽；普通统计合并到共享块
          - `favicon/manifest` 的 `%b` `-` 归一化为 0；404 图标/manifest 也计带宽
          - `mobile/tablet` 豁免前先查显式 `crawler`（`BytespiderRobotID` / `RegisteredCrawlerRobotID`），对旧版 `robots.pm` 有 `defined(&...)` 保护
          - `UnknownAgentHistoryKey` 用于 `UNKNOWNREFERER` / `UNKNOWNREFERERBROWSER` **写入侧**（4 处），加载与写入统一 `%20`
          - `Read_Config` 每次读配置前重置证据状态
          - 发布包排除 `tools/t/`；`RPM/Debian/FreeBSD` 声明 `python3 >= 3.6`
          - 一批 `|| 0` / `// 0` 防 undef；`file_filt` 正则修正；`ROBOT` section 末尾数字字段解析修复；`error()` 转义

