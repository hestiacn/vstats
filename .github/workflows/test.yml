name: AWStats UTF-8 社区版完整测试

on:
  push:
    branches: [ develop, release1]
  pull_request:
    branches: [ release1 ]
  workflow_dispatch:

jobs:
  test:
    name: 测试 AWStats (Perl ${{ matrix.perl-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        perl-version: ['5.10', '5.16', '5.20', '5.26', '5.32', '5.34']
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      
    - name: 设置 Perl ${{ matrix.perl-version }}
      uses: shogo82148/actions-setup-perl@v1
      with:
        perl-version: ${{ matrix.perl-version }}
        
    - name: 安装依赖模块
      run: |
        # 必需模块
        cpanm JSON::XS Try::Tiny Encode
        
        # GeoIP 模块（允许失败）
        cpanm Geo::IPfree || true
        cpanm Geo::IP Geo::IP::PurePerl || true
        
        # 显示已安装模块
        echo "✅ 已安装的 GeoIP 模块:"
        perl -MGeo::IPfree -e 'print "Geo::IPfree OK\n"' 2>/dev/null || echo "Geo::IPfree 未安装"
        perl -MGeo::IP -e 'print "Geo::IP OK\n"' 2>/dev/null || echo "Geo::IP 未安装"

    - name: 创建测试目录
      run: |
        # 创建必要的目录
        mkdir -p test/result
        mkdir -p test/reports
        mkdir -p /tmp/awstats
        mkdir -p ./data
        
        # 创建 GitHub 工作空间的路径
        WORKSPACE="${{ github.workspace }}"
        mkdir -p "$WORKSPACE/test/awstats/result"
        mkdir -p "$WORKSPACE/test/reports"
        mkdir -p "$WORKSPACE/test/log"
        mkdir -p "$WORKSPACE/test/maxmind"
        
        # 给权限
        chmod 777 "$WORKSPACE/test/awstats/result"
        chmod 777 "$WORKSPACE/test/reports"
        
        echo "✅ 目录已创建"
        ls -la "$WORKSPACE/test/" || true

    - name: 查看文件列表
      run: |
        echo "=== CGI-BIN 目录 ==="
        ls -la wwwroot/cgi-bin/ || true
        echo ""
        echo "=== 配置文件目录 ==="
        ls -la test/awstats/conf/ || true
        echo ""

    - name: 使用本地 GeoIP 数据文件
      run: |
        if [ -f "test/maxmind/GeoIP.dat" ]; then
          echo "✅ 使用本地 GeoIP.dat"
          ls -la test/maxmind/GeoIP.dat
        else
          echo "⚠️ 本地 GeoIP.dat 不存在"
        fi

    - name: 确认 GeoLite2 City 数据库
      run: |
        echo "=== 确认 GeoLite2 City 数据库 ==="
        ls -la test/maxmind/GeoLite2-City.mmdb || echo "⚠️ 文件不存在"

    - name: 检查 _t() 函数调用数量
      run: |
        echo "=== 检查 _t() 函数调用 ===" > test/result/t_function_check.log
        T_COUNT=$(grep -c "_t(" wwwroot/cgi-bin/awstats.pl || echo 0)
        echo "总共有 $T_COUNT 处 _t() 调用" >> test/result/t_function_check.log
        echo "" >> test/result/t_function_check.log
        echo "前20处 _t() 调用:" >> test/result/t_function_check.log
        grep -n "_t(" wwwroot/cgi-bin/awstats.pl | head -20 >> test/result/t_function_check.log
        
    - name: 测试中文语言
      run: |
        echo "=== 测试中文语言 ===" > test/result/lang_test.log
        cd wwwroot/cgi-bin
        WORKSPACE="${{ github.workspace }}"
        perl -I. -e '
          require "awstats.pl";
          $Lang = "zh-cn";
          Read_Language_Data("zh-cn");
          print "月份测试:\n";
          for (1..12) {
            my $month = sprintf("month_%02d", $_);
            printf "  %s -> %s\n", $month, _t($month);
          }
          print "\n界面元素测试:\n";
          my @items = ("Unique visitors", "Visits", "Pages", "Hits", "Bandwidth");
          foreach my $item (@items) {
            printf "  %s -> %s\n", $item, _t($item);
          }
        ' >> "$WORKSPACE/test/result/lang_test.log" 2>&1 || echo "语言测试失败" >> "$WORKSPACE/test/result/lang_test.log"

    - name: 检查明暗模式切换
      run: |
        echo "=== 检查明暗模式切换 ===" > test/result/theme_detailed.log
        THEME_COUNT=$(grep -c "theme-toggle" wwwroot/cgi-bin/awstats.pl || echo 0)
        echo "找到 $THEME_COUNT 处 theme-toggle 相关代码" >> test/result/theme_detailed.log
        echo "" >> test/result/theme_detailed.log
        grep -n "theme-toggle\|data-theme\|dark mode\|亮色模式\|暗色模式" wwwroot/cgi-bin/awstats.pl >> test/result/theme_detailed.log

    - name: 检查主题切换
      run: |
        echo "=== 检查主题切换 ===" > test/result/theme_check.log
        if grep -q "theme-toggle" wwwroot/cgi-bin/awstats.pl; then
          echo "✅ 主题切换代码存在" >> test/result/theme_check.log
          grep -n "theme-toggle" wwwroot/cgi-bin/awstats.pl | head -5 >> test/result/theme_check.log
        else
          echo "❌ 未找到主题切换代码" >> test/result/theme_check.log
        fi
        
    - name: 检查 geoipfree 自动加载
      continue-on-error: true
      run: |
        echo "=== 检查 geoipfree 自动加载 ===" > test/result/geoip_check.log
        if grep -q "geoipfree" wwwroot/cgi-bin/awstats.pl; then
          echo "✅ geoipfree 代码存在" >> test/result/geoip_check.log
          grep -n "geoipfree" wwwroot/cgi-bin/awstats.pl >> test/result/geoip_check.log
        else
          echo "❌ 未找到 geoipfree 代码" >> test/result/geoip_check.log
        fi
        
    - name: 检查 MAIN 代码是否被 unless 包住
      run: |
        echo "=== 检查 MAIN 代码结构 ==="
        echo "【unless 开头】"
        grep -n 'unless ($TEST_MODE) {' wwwroot/cgi-bin/awstats.pl | head -1 || echo "❌ 未找到"
        echo ""
        echo "【结束位置】"
        grep -n '} # 结束 unless ($TEST_MODE)' wwwroot/cgi-bin/awstats.pl || echo "❌ 未找到"
        echo ""
        echo "【最后10行】"
        tail -10 wwwroot/cgi-bin/awstats.pl

    - name: 创建测试日志文件
      run: |
        WORKSPACE="${{ github.workspace }}"
        
        # 创建 testglobal.log
        cat > "$WORKSPACE/test/log/testglobal.log" << 'EOF'
        127.0.0.1 - - [10/Jan/2001:02:14:14 +0200] "GET /index.html HTTP/1.1" 200 1234 "http://google.com" "Mozilla/5.0"
        192.168.1.1 - - [10/Jan/2001:02:15:14 +0200] "GET /page.html HTTP/1.1" 404 567 "http://yahoo.com" "Mozilla/5.0"
        10.0.0.1 - - [10/Jan/2001:02:16:14 +0200] "GET /images/logo.png HTTP/1.1" 200 34567 "http://google.com" "Mozilla/5.0"
        EOF
        
        # 复制到其他测试需要的文件
        cp "$WORKSPACE/test/log/testglobal.log" "$WORKSPACE/test/log/testnginx.log"
        cp "$WORKSPACE/test/log/testglobal.log" "$WORKSPACE/test/log/testsmall.log"
        cp "$WORKSPACE/test/log/testglobal.log" "$WORKSPACE/test/log/testtime5.log"
        
        echo "✅ 测试日志文件已创建"
        ls -la "$WORKSPACE/test/log/" || true

    - name: 测试中文语言
      run: |
        echo "=== 测试中文语言 ===" > test/result/lang_test.log
        cd wwwroot/cgi-bin
        WORKSPACE="${{ github.workspace }}"
        perl -I. -e '
          $TEST_MODE = 1;
          do "awstats.pl";
          $Lang = "zh-cn";
          Read_Language_Data("zh-cn");
          print "月份测试:\n";
          for (1..12) {
            my $month = sprintf("month_%02d", $_);
            printf "  %s -> %s\n", $month, _t($month);
          }
          print "\n界面元素测试:\n";
          my @items = ("Unique visitors", "Visits", "Pages", "Hits", "Bandwidth");
          foreach my $item (@items) {
            printf "  %s -> %s\n", $item, _t($item);
          }
        ' >> "$WORKSPACE/test/result/lang_test.log" 2>&1 || echo "语言测试失败" >> "$WORKSPACE/test/result/lang_test.log"

    - name: 测试日期格式
      run: |
        echo "=== 测试日期格式 ===" > test/result/date_test.log
        cd wwwroot/cgi-bin
        WORKSPACE="${{ github.workspace }}"
        perl -I. -e '
          $TEST_MODE = 1;
          do "awstats.pl";
          $Lang = "zh-cn";
          Read_Language_Data("zh-cn");
          print "短格式: " . _t("dateformat_short") . "\n";
          print "长格式: " . _t("dateformat_long") . "\n";
          my $date = Format_Date("20010101120000", 1);
          print "示例日期: " . $date . "\n";
        ' >> "$WORKSPACE/test/result/date_test.log" 2>&1 || echo "日期测试失败" >> "$WORKSPACE/test/result/date_test.log"

    - name: 运行测试
      run: |
        cd wwwroot/cgi-bin
        WORKSPACE="${{ github.workspace }}"
        
        # 测试配置列表
        for config in testsmall testglobal testnginx testtime5; do
          echo "========== 测试 $config =========="
          
          # 检查配置文件
          if [ ! -f "../../test/awstats/conf/awstats.$config.conf" ]; then
            echo "❌ 配置文件不存在: awstats.$config.conf"
            continue
          fi
          
          # 复制配置文件到当前目录
          cp "../../test/awstats/conf/awstats.$config.conf" .
          
          # 修改配置文件中的路径
          sed -i "s|/home/ldestailleur/git/awstats/test/awstats/result|$WORKSPACE/test/awstats/result|g" "awstats.$config.conf"
          sed -i "s|DirData=.*|DirData=\"$WORKSPACE/test/awstats/result\"|" "awstats.$config.conf"
          sed -i "s|/home/ldestailleur/git/awstats/test/log|$WORKSPACE/test/log|g" "awstats.$config.conf"
          sed -i "s|/home/ldestailleur/git/awstats/test/maxmind|$WORKSPACE/test/maxmind|g" "awstats.$config.conf"

          # 显示修改后的配置
          echo "▶ 配置文件中的路径:"
          grep "DirData" "awstats.$config.conf" || true
          grep "LogFile" "awstats.$config.conf" || true
          
          # 运行更新
          echo "▶ 运行更新..."
          perl awstats.pl -config=$config -update > "$WORKSPACE/test/result/${config}_update.log" 2>&1 || true
          UPDATE_STATUS=$?
          
          # 显示更新结果
          if [ $UPDATE_STATUS -eq 0 ]; then
            echo "  ✅ 更新成功"
          else
            echo "  ❌ 更新失败 (状态码: $UPDATE_STATUS)"
          fi
          
          # 显示错误日志
          if [ -f "$WORKSPACE/test/result/${config}_update.log" ]; then
            echo "▶ 更新日志:"
            cat "$WORKSPACE/test/result/${config}_update.log" | head -20
          fi
          
          # 生成报告
          echo "▶ 生成报告..."
          perl awstats.pl -config=$config -month=01 -year=2001 -output > "$WORKSPACE/test/reports/${config}.html" 2>&1 || true
          
          # 生成详细报告
          for type in alldomains allhosts urldetail browserdetail osdetail; do
            perl awstats.pl -config=$config -month=01 -year=2001 -output=$type > "$WORKSPACE/test/reports/${config}_${type}.html" 2>&1 || true
          done
          
          # 清理配置文件
          rm -f "awstats.$config.conf"
          echo "✅ 测试 $config 完成"
          echo ""
        done

    - name: 查看生成的日志
      if: always()
      run: |
        echo "=== 测试结果文件 ==="
        ls -la test/result/
        echo ""
        echo "=== 更新日志内容 ==="
        for log in test/result/*_update.log; do
          if [ -f "$log" ]; then
            echo "--- $log ---"
            tail -20 "$log"
            echo ""
          fi
        done
        echo ""
        echo "=== 语言测试结果 ==="
        cat test/result/lang_test.log 2>/dev/null || echo "无语言测试日志"
        echo ""
        echo "=== 日期测试结果 ==="
        cat test/result/date_test.log 2>/dev/null || echo "无日期测试日志"

    - name: 生成 Markdown 汇总报告
      if: always()
      run: |
        # 创建汇总报告
        REPORT="test/reports/FULL_TEST_REPORT_${{ matrix.perl-version }}.md"
        
        echo "# AWStats UTF-8社区版完整测试报告" > $REPORT
        echo "" >> $REPORT
        echo "## 测试信息" >> $REPORT
        echo "" >> $REPORT
        echo "- **测试时间**: $(date)" >> $REPORT
        echo "- **Perl 版本**: ${{ matrix.perl-version }}" >> $REPORT
        echo "- **提交**: ${{ github.sha }}" >> $REPORT
        echo "- **分支**: ${{ github.ref }}" >> $REPORT
        echo "" >> $REPORT
        
        echo "## 📊 测试结果摘要" >> $REPORT
        echo "" >> $REPORT
        
        # 添加各测试的更新日志
        for config in testsmall testglobal testnginx testtime5; do
          echo "### $config 测试结果" >> $REPORT
          echo "" >> $REPORT
          echo '```' >> $REPORT
          if [ -f "test/result/${config}_update.log" ]; then
            cat "test/result/${config}_update.log" >> $REPORT
          else
            echo "无日志文件" >> $REPORT
          fi
          echo '```' >> $REPORT
          echo "" >> $REPORT
        done
        
        # 添加语言测试结果
        echo "## 🌐 语言测试结果" >> $REPORT
        echo "" >> $REPORT
        echo '```' >> $REPORT
        cat test/result/lang_test.log 2>/dev/null || echo "无语言测试日志" >> $REPORT
        echo '```' >> $REPORT
        echo "" >> $REPORT
        
        # 添加日期测试结果
        echo "## 📅 日期测试结果" >> $REPORT
        echo "" >> $REPORT
        echo '```' >> $REPORT
        cat test/result/date_test.log 2>/dev/null || echo "无日期测试日志" >> $REPORT
        echo '```' >> $REPORT
        echo "" >> $REPORT
        
        # 添加 $Message 检查结果
        echo "## 🔍 \$Message 引用检查" >> $REPORT
        echo "" >> $REPORT
        echo '```' >> $REPORT
        cat test/result/message_check.log 2>/dev/null || echo "无检查日志" >> $REPORT
        echo '```' >> $REPORT
        echo "" >> $REPORT
        
        # 添加额外检查结果
        echo "## 🔧 额外检查结果" >> $REPORT
        echo "" >> $REPORT
        
        echo "### _t() 函数调用" >> $REPORT
        echo '```' >> $REPORT
        cat test/result/t_function_check.log 2>/dev/null || echo "无日志" >> $REPORT
        echo '```' >> $REPORT
        echo "" >> $REPORT
        
        echo "### 语言文件" >> $REPORT
        echo '```' >> $REPORT
        cat test/result/lang_files_check.log 2>/dev/null || echo "无日志" >> $REPORT
        echo '```' >> $REPORT
        echo "" >> $REPORT
        
        echo "### 明暗模式详细" >> $REPORT
        echo '```' >> $REPORT
        cat test/result/theme_detailed.log 2>/dev/null || echo "无日志" >> $REPORT
        echo '```' >> $REPORT
        echo "" >> $REPORT
        
        echo "### GeoIP 自动加载详细" >> $REPORT
        echo '```' >> $REPORT
        cat test/result/geoip_detailed.log 2>/dev/null || echo "无日志" >> $REPORT
        echo '```' >> $REPORT
        echo "" >> $REPORT
        
        echo "✅ 汇总报告已生成: $REPORT"
        
    - name: 上传测试结果
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-perl-${{ matrix.perl-version }}
        path: |
          test/reports/FULL_TEST_REPORT_*.md
          test/reports/*.html
          test/result/*.log
          
    - name: 测试总结
      if: always()
      run: |
        echo "## 🎯 测试完成！" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📊 测试结果汇总" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        for config in testsmall testglobal testnginx testtime5; do
          if [ -f "test/result/${config}_update.log" ]; then
            if grep -q "error" "test/result/${config}_update.log"; then
              echo "❌ $config: 有错误"
            else
              echo "✅ $config: 通过"
            fi
          else
            echo "❌ $config: 无日志"
          fi
        done
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "📥 完整报告已上传，请下载 artifacts 查看" >> $GITHUB_STEP_SUMMARY