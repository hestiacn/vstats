#------------------------------------------------------------------------
# 以下是 awstats 标准配置，您可根据需要调整以下注释部分对应的参数。
# awstats.model.conf 文件为完整配置说明，如有需要请阅读参考。
# Below is the standard awstats configuration. Adjust the parameters
# in the commented sections as needed.
# The awstats.model.conf file contains the complete configuration reference.
# Refer to it if needed.
#------------------------------------------------------------------------

# 域名日志位置。系统 Debian/Ubuntu 此配置来自 hestiacp，
# /var/log/apache2/domains/yourdomain.com.log
# Domain log file location. On Debian/Ubuntu with HestiaCP, this is
# /var/log/apache2/domains/yourdomain.com.log
LogFile="/var/log/apache2/domains/yourdomain.com.log"
LogType=W
LogFormat=1
LogSeparator=" "
# 域名名称
# Domain name
SiteDomain="yourdomain.com"
HostAliases=""
# 数据文件存放路径，username 为站点运行用户名，请根据实际情况调整
# Data file storage path. "username" is the site's runtime user,
# adjust according to your actual setup.
DirData="/home/username/web/yourdomain.com/stats"
# web 访问 awstats 别名路径
# Web access alias path for awstats
DirCgi="/vstats"
# 图标 Web 访问路径。图标文件夹位于 /usr/share/awstats/icon，
# 建议用 ln -s /usr/share/awstats/icon 到 awstats 数据目录下，复制也可以，按照您喜欢的方式。
# Icon web access path. Icon files are located at /usr/share/awstats/icon.
# Recommended: create a symlink with
#   ln -s /usr/share/awstats/icon <awstats_data_dir>/
# or copy the folder, whichever you prefer.
DirIcons="/vstats/icon"

# 以下参数默认不需要调整。如有需要请根据实际需求修改。
# The following parameters usually don't need adjustment.
# Modify them only if necessary.
# 是否允许从浏览器更新统计（0=禁止，1=允许）
# Allow updating stats from browser (0=disabled, 1=enabled)
AllowToUpdateStatsFromBrowser=0
# 允许查看全年报告（0=禁止，1=仅命令行，2=允许，3=允许 CGI）
# Allow full year view (0=disabled, 1=CLI only, 2=allowed, 3=allowed via CGI)
AllowFullYearView=2
# 启用更新锁
# Enable update lock
EnableLockForUpdate=1
# DNS 解析相关
# DNS resolution settings
DNSStaticCacheFile="dnscache.txt"
DNSLastUpdateCacheFile="dnscachelastupdate.txt"
SkipDNSLookupFor=""
# 访问控制
# Access control
AllowAccessFromWebToAuthenticatedUsersOnly=0
AllowAccessFromWebToFollowingAuthenticatedUsers=""
AllowAccessFromWebToFollowingIPAddresses=""
# 数据目录不存在时是否创建
# Create data directory if it doesn't exist
CreateDirDataIfNotExists=0
# 数据文件格式
# Data file format
BuildHistoryFormat=text
BuildReportFormat=html
# 数据文件权限
# Data file permissions
SaveDatabaseFilesWithPermissionsForEveryone=1
# 日志清理与备份
# Log purging and backup
PurgeLogFile=0
ArchiveLogRecords=0
KeepBackupOfHistoricFiles=1
# 默认首页
# Default index files
DefaultFile="index.php index.html"
# 跳过规则
# Skip rules
SkipHosts="127.0.0.1"
SkipUserAgents=""
SkipFiles=""
SkipReferrersBlackList=""
# 只处理规则
# Only-process rules
OnlyHosts=""
OnlyUserAgents=""
OnlyUsers=""
OnlyFiles=""
# 页面类型
# Page types
UseDefaultNotPageList=1
NotPageList=""
# HTTP/SMTP 状态码
# HTTP/SMTP status codes
ValidHTTPCodes="200 304"
ValidSMTPCodes="1 250"
# URL 处理
# URL handling
AuthenticatedUsersNotCaseSensitive=0
URLNotCaseSensitive=0
URLWithAnchor=0
URLQuerySeparators="?;"
URLWithQuery=0
URLWithQueryWithOnlyFollowingParameters=""
URLWithQueryWithoutFollowingParameters=""
URLReferrerWithQuery=0
WarningMessages=1
ErrorMessages=""
LevelForRobotsDetection=2
DebugMessages=0
NbOfLinesForCorruptedLog=50
WrapperScript=""
DecodeUA=0
MiscTrackerUrl="/js/awstats_misc_tracker.js"
UseFramesWhenCGI=1
DetailedReportsOnNewWindows=1
Expires=3600
MaxRowsInHTMLOutput=1000
Lang="auto"
DirLang="./lang"
ShowMenu=1
ShowSummary=UVPHB
ShowMonthStats=UVPHB
ShowDaysOfMonthStats=VPHB
ShowDaysOfWeekStats=PHB
ShowHoursStats=PHB
ShowDomainsStats=PHB
ShowHostsStats=PHBL
ShowAuthenticatedUsers=0
ShowRobotsStats=HBL
ShowWormsStats=0
ShowEMailSenders=0
ShowEMailReceivers=0
ShowSessionsStats=1
ShowPagesStats=PBEX
ShowFileTypesStats=HB
ShowFileSizesStats=0
ShowDownloadsStats=HBCMT
ShowOSStats=1
ShowBrowsersStats=1
ShowScreenSizeStats=0
ShowOriginStats=PH
ShowKeyphrasesStats=1
ShowKeywordsStats=1
ShowMiscStats=a
ShowHTTPErrorsStats=1
ShowSMTPErrorsStats=0
ShowClusterStats=0
AddDataArrayMonthStats=1
AddDataArrayShowDaysOfMonthStats=1
AddDataArrayShowDaysOfWeekStats=1
AddDataArrayShowHoursStats=1
IncludeInternalLinksInOriginSection=0
MaxNbOfDomain=10
MinHitDomain=1
MaxNbOfHostsShown=10
MinHitHost=1
MaxNbOfLoginShown=10
MinHitLogin=1
MaxNbOfRobotShown=10
MinHitRobot=1
MaxNbOfDownloadsShown=10
MinHitDownloads=1
MaxNbOfPageShown=10
MinHitFile=1
MaxNbOfOsShown=10
MinHitOs=1
MaxNbOfBrowsersShown=10
MinHitBrowser=1
MaxNbOfScreenSizesShown=5
MinHitScreenSize=1
MaxNbOfWindowSizesShown=5
MinHitWindowSize=1
MaxNbOfRefererShown=10
MinHitRefer=1
MaxNbOfKeyphrasesShown=10
MinHitKeyphrase=1
MaxNbOfKeywordsShown=10
MinHitKeyword=1
MaxNbOfEMailsShown=20
MinHitEMail=1
# 一周的第一天（0=周日排最前，1=周一排最前）
# First day of week (0=Sunday first, 1=Monday first)
FirstDayOfWeek=0
ShowFlagLinks=""
ShowLinksOnUrl=1
UseHTTPSLinkForUrl=""
MaxLengthOfShownURL=64
HTMLHeadSection=""
HTMLEndSection=""
MetaRobot=0
# Logo
Logo="awstats_logo6.svg"
LogoLink="https://awstats.org"
# 品牌显示
# Brand display
BrandLink="https://hestiacp.com"
BrandPlatform="RHEL/Debian"
# 文档定位所在路径
# Documentation base URL
StatsUrl="/vstats"
BarWidth=260
BarHeight=90
StyleSheet=""
ExtraTrackedRowsLimit=500
# 加载插件
# Load plugins
LoadPlugin="geoipfree"