#=============================================================================
# AWStats General Configuration File / AWStats 通用配置文件
# Version: 8.1
#------------------------------------------------------------------------------
# Configuration Notes - The Pain of Manual Setup
#------------------------------------------------------------------------------
# The agony of configuring AWStats manually:
#   ❌ Create config files for each domain manually
#   ❌ Set log paths manually
#   ❌ Add cron jobs manually
#   ❌ Configure web permissions manually
#   ❌ Repeat for every single domain!
#
# Using Hestia Control Panel? Say goodbye to all that pain!
# Hestia handles everything automatically:
#   ✅ AWStats auto-enabled when domain is added
#   ✅ Log paths auto-configured
#   ✅ Cron updates auto-scheduled
#   ✅ Web permissions auto-set
#   
# Just visit https://your-domain/vstats/ to see your stats
# That's how smooth it should be! 🎉
#------------------------------------------------------------------------------
# 配置文件说明 - 手动配置的烦恼
#------------------------------------------------------------------------------
# 手动配置 AWStats 的痛苦
#   ❌ 手动创建域名配置文件
#   ❌ 手动设置日志路径
#   ❌ 手动添加定时任务
#   ❌ 手动配置 Web 权限
#   ❌ 每个域名都要重复一遍！
#
# 如果你在用 Hestia 控制面板，恭喜你，这些痛苦都结束了！
# Hestia 全自动搞定一切：
#   ✅ 域名添加完成，AWStats 自动启用
#   ✅ 日志路径自动配置
#   ✅ 定时更新自动添加
#   ✅ Web 访问权限自动设置
#   
# 访问 https://你添加的域名/vstats/ 即可查看统计
# 就是这么丝滑！🎉
#=============================================================================

#------------------------------------------------------------------------------
# Log File Configuration / 日志文件配置
# Please modify after installation / 安装后请修改
#------------------------------------------------------------------------------
LogFile="/var/log/nginx/access.log"
# Alternative log paths / 备选日志路径：
# Apache: /var/log/apache2/access.log
# Nginx:  /var/log/nginx/access.log
# Supports wildcards / 支持通配符: /var/log/nginx/access.log*

LogType=W                 # Log type / 日志类型: W=web, F=ftp, M=mail
LogFormat=1               # Log format / 日志格式: 1=Apache combined, 2=IIS, etc.
LogSeparator=" "          # Log field separator / 日志字段分隔符

#------------------------------------------------------------------------------
# Site Domain Configuration / 网站域名配置
# Please modify after installation / 安装后请修改
#------------------------------------------------------------------------------
SiteDomain="your-domain.com"           # Your main domain / 您的主域名
HostAliases="www.your-domain.com localhost 127.0.0.1"  # Additional hostnames / 其他主机名

#------------------------------------------------------------------------------
# Data Directory Configuration / 数据目录配置
#------------------------------------------------------------------------------
DirData="/var/lib/awstats"             # Data files directory / 数据文件目录
DirCgi="/usr/lib/cgi-bin"              # CGI scripts directory / CGI脚本目录
DirIcons="/awstats/icon"                # Icons directory / 图标目录
DirLang="/usr/share/awstats/lang"       # Language files directory / 语言文件目录

#------------------------------------------------------------------------------
# Update Control / 更新控制
#------------------------------------------------------------------------------
AllowToUpdateStatsFromBrowser=0         # Allow update from browser / 允许从浏览器更新
AllowFullYearView=2                     # Allow year view / 允许年度视图
EnableLockForUpdate=1                    # Enable lock file / 启用锁文件
PurgeLogFile=0                           # Purge log after update / 更新后清理日志
ArchiveLogRecords=0                       # Archive log records / 归档日志记录
KeepBackupOfHistoricFiles=1               # Keep backup / 保留备份

#------------------------------------------------------------------------------
# DNS Lookup Configuration / DNS 查找配置
#------------------------------------------------------------------------------
DNSStaticCacheFile="dnscache.txt"               # DNS cache file / DNS缓存文件
DNSLastUpdateCacheFile="dnscachelastupdate.txt" # Last update cache / 最后更新缓存
SkipDNSLookupFor=""                              # Skip DNS for these / 跳过DNS的IP
SkipHosts="127.0.0.1 192.168.0.0/16 10.0.0.0/8" # Hosts to skip / 跳过的主机
SkipUserAgents=""                                 # User agents to skip / 跳过的用户代理
SkipFiles=""                                       # Files to skip / 跳过的文件
SkipReferrersBlackList=""                          # Referrers to skip / 跳过的来源
OnlyHosts=""                                        # Only these hosts / 仅这些主机
OnlyUserAgents=""                                   # Only these user agents / 仅这些用户代理
OnlyUsers=""                                        # Only these users / 仅这些用户
OnlyFiles=""                                        # Only these files / 仅这些文件

#------------------------------------------------------------------------------
# Log Parsing Rules / 日志解析规则
#------------------------------------------------------------------------------
NotPageList="css js class gif jpg jpeg png bmp ico rss xml swf"  # Not page files / 非页面文件
ValidHTTPCodes="200 304"                          # Valid HTTP codes / 有效HTTP状态码
ValidSMTPCodes="1 250"                             # Valid SMTP codes / 有效SMTP状态码
AuthenticatedUsersNotCaseSensitive=0                # Case sensitive / 大小写敏感
URLNotCaseSensitive=0                               # URL case sensitive / URL大小写敏感
URLWithAnchor=0                                      # Keep anchors / 保留锚点
URLQuerySeparators="?;"                              # Query separators / 查询分隔符
URLWithQuery=0                                       # Keep query string / 保留查询字符串
URLWithQueryWithOnlyFollowingParameters=""           # Keep only these params / 仅保留这些参数
URLWithQueryWithoutFollowingParameters=""            # Remove these params / 移除这些参数
URLReferrerWithQuery=0                               # Keep referrer query / 保留来源查询

#------------------------------------------------------------------------------
# Debug Settings / 调试设置
#------------------------------------------------------------------------------
WarningMessages=1          # Show warnings / 显示警告
ErrorMessages=""           # Error messages / 错误消息
DebugMessages=0             # Debug mode / 调试模式
NbOfLinesForCorruptedLog=50 # Lines to show for corrupted log / 损坏日志显示行数

#------------------------------------------------------------------------------
# Tracking Features / 跟踪功能
#------------------------------------------------------------------------------
MiscTrackerUrl="/js/awstats_misc_tracker.js"  # Tracker script / 跟踪脚本
DecodeUA=0                                      # Decode User Agent / 解码用户代理
WrapperScript=""                                 # Wrapper script / 包装脚本

#------------------------------------------------------------------------------
# Interface Settings / 界面设置
#------------------------------------------------------------------------------
UseFramesWhenCGI=1                # Use frames / 使用框架
DetailedReportsOnNewWindows=1      # Open details in new window / 在新窗口打开详情
Expires=3600                       # Cache expiration / 缓存过期时间
MaxRowsInHTMLOutput=1000           # Max rows per page / 每页最大行数
Lang="auto"                        # Language / 语言
ShowMenu=1                         # Show menu / 显示菜单
ShowLinksOnUrl=1                    # Show links on URLs / 在URL上显示链接
UseHTTPSLinkForUrl=""               # Use HTTPS / 使用HTTPS
MaxLengthOfShownURL=64              # Max URL length to show / 显示URL最大长度
HTMLHeadSection=""                   # Custom HTML head / 自定义HTML头部
HTMLEndSection=""                    # Custom HTML end / 自定义HTML尾部
MetaRobot=0                          # Meta robots / 搜索引擎机器人
Logo="awstats_logo.svg"               # Logo file / Logo文件
LogoLink="https://awstats.org"        # Logo link / Logo链接
BarWidth=260                          # Chart bar width / 图表宽度
BarHeight=90                          # Chart bar height / 图表高度
StyleSheet=""                         # Custom CSS / 自定义样式

#------------------------------------------------------------------------------
# Report Content Display / 报告内容显示
#------------------------------------------------------------------------------
ShowSummary=UVPHB           # Summary / 概要
ShowMonthStats=UVPHB        # Monthly stats / 月度统计
ShowDaysOfMonthStats=VPHB   # Daily stats / 每日统计
ShowDaysOfWeekStats=PHB      # Weekly stats / 每周统计
ShowHoursStats=PHB           # Hourly stats / 每小时统计
ShowDomainsStats=PHB         # Domain stats / 域名统计
ShowHostsStats=PHBL          # Hosts stats / 主机统计
ShowAuthenticatedUsers=0     # Authenticated users / 认证用户
ShowRobotsStats=HBL          # Robots stats / 爬虫统计
ShowWormsStats=0             # Worms stats / 蠕虫统计
ShowEMailSenders=0           # Email senders / 邮件发送者
ShowEMailReceivers=0         # Email receivers / 邮件接收者
ShowSessionsStats=1          # Sessions stats / 会话统计
ShowPagesStats=PBEX          # Pages stats / 页面统计
ShowFileTypesStats=HB        # File types / 文件类型
ShowFileSizesStats=0         # File sizes / 文件大小
ShowDownloadsStats=HB        # Downloads / 下载统计
ShowOSStats=1                # OS stats / 操作系统统计
ShowBrowsersStats=1          # Browsers stats / 浏览器统计
ShowScreenSizeStats=0        # Screen sizes / 屏幕尺寸
ShowOriginStats=PH           # Origin stats / 来源统计
ShowKeyphrasesStats=1        # Keyphrases / 关键短语
ShowKeywordsStats=1          # Keywords / 关键词
ShowMiscStats=a              # Misc stats / 其他统计
ShowHTTPErrorsStats=1        # HTTP errors / HTTP错误
ShowSMTPErrorsStats=0        # SMTP errors / SMTP错误
ShowClusterStats=0           # Cluster stats / 集群统计

#------------------------------------------------------------------------------
# Chart Data Sources / 图表数据源
#------------------------------------------------------------------------------
AddDataArrayMonthStats=1                 # Monthly charts / 月度图表
AddDataArrayShowDaysOfMonthStats=1       # Daily charts / 每日图表
AddDataArrayShowDaysOfWeekStats=1        # Weekly charts / 每周图表
AddDataArrayShowHoursStats=1              # Hourly charts / 每小时图表

#------------------------------------------------------------------------------
# Origin Statistics / 来源统计
#------------------------------------------------------------------------------
IncludeInternalLinksInOriginSection=0     # Include internal links / 包含内部链接

#------------------------------------------------------------------------------
# Display Limits / 显示行数限制
#------------------------------------------------------------------------------
MaxNbOfDomain = 10          # Max domains / 最大域名数
MinHitDomain  = 1            # Min hits per domain / 最小命中数
MaxNbOfHostsShown = 10       # Max hosts / 最大主机数
MinHitHost    = 1            # Min hits per host / 最小命中数
MaxNbOfLoginShown = 10       # Max logins / 最大登录用户数
MinHitLogin   = 1            # Min hits per login / 最小命中数
MaxNbOfRobotShown = 10       # Max robots / 最大爬虫数
MinHitRobot   = 1            # Min hits per robot / 最小命中数
MaxNbOfDownloadsShown = 10   # Max downloads / 最大下载数
MinHitDownloads = 1          # Min hits per download / 最小命中数
MaxNbOfPageShown = 10        # Max pages / 最大页面数
MinHitFile    = 1            # Min hits per file / 最小命中数
MaxNbOfOsShown = 10          # Max OS / 最大操作系统数
MinHitOs      = 1            # Min hits per OS / 最小命中数
MaxNbOfBrowsersShown = 10    # Max browsers / 最大浏览器数
MinHitBrowser = 1            # Min hits per browser / 最小命中数
MaxNbOfScreenSizesShown = 5  # Max screen sizes / 最大屏幕尺寸数
MinHitScreenSize = 1         # Min hits per size / 最小命中数
MaxNbOfWindowSizesShown = 5  # Max window sizes / 最大窗口尺寸数
MinHitWindowSize = 1         # Min hits per window / 最小命中数
MaxNbOfRefererShown = 10     # Max referers / 最大来源数
MinHitRefer   = 1            # Min hits per referer / 最小命中数
MaxNbOfKeyphrasesShown = 10  # Max keyphrases / 最大关键短语数
MinHitKeyphrase = 1          # Min hits per phrase / 最小命中数
MaxNbOfKeywordsShown = 10    # Max keywords / 最大关键词数
MinHitKeyword = 1            # Min hits per keyword / 最小命中数
MaxNbOfEMailsShown = 20      # Max emails / 最大邮件数
MinHitEMail   = 1            # Min hits per email / 最小命中数

#------------------------------------------------------------------------------
# First Day of Week / 每周第一天
#------------------------------------------------------------------------------
FirstDayOfWeek=0             # 0=Sunday, 1=Monday / 0=周日, 1=周一

#------------------------------------------------------------------------------
# Flag Links / 国旗链接
#------------------------------------------------------------------------------
ShowFlagLinks=""             # Show flag links / 显示国旗链接

#------------------------------------------------------------------------------
# Extra Tracking / 额外跟踪
#------------------------------------------------------------------------------
ExtraTrackedRowsLimit=500    # Extra rows limit / 额外行数限制

